o público. Traduções variam: confira a edição.', links: [{ l: 'Buscar no Wikisource', u: ws('Meditações Marco Aurélio') }, { l: 'Domínio Público', u: DP }] },\n      { id: 'b13', g: 'B', t: 'A Origem das Espécies', au: 'Charles Darwin', cat: 'Ciência e tecnologia', type: 'Domínio público', c: 4, d: 'A obra que apresentou a teoria da seleção natural. Disponível em inglês no Projeto Gutenberg.', avail: 'Texto original em domínio público (inglês).', links: [{ l: 'Buscar no Gutenberg', u: gut('Origin of Species Darwin') }] },\n      { id: 'b14', g: 'B', t: 'Caderno de Cidadania Financeira', au: 'Banco Central do Brasil', cat: 'Educação financeira', type: 'Material oficial', c: 2, d: 'Material gratuito sobre orçamento, crédito, poupança e direitos do consumidor.', avail: 'Gratuito, em PDF no site do Banco Central.', links: [{ l: 'Abrir o PDF', u: 'https://www.bcb.gov.br/pre/pef/port/caderno_cidadania_financeira.pdf' }] },\n      { id: 'b15', g: 'B', t: 'Retórica', au: 'Aristóteles', cat: 'Comunicação e criatividade', type: 'Domínio público', c: 0, d: 'Clássico sobre a arte de persuadir e argumentar. Ajuda a pensar em como comunicar suas ideias.', avail: 'Texto em domínio público. Traduções variam: confira a edição.', links: [{ l: 'Buscar no Wikisource', u: ws('Retórica Aristóteles') }, { l: 'Domínio Público', u: DP }] }\n    ];\n\n    // Tutoriais: como encontrar cursos em outras plataformas\n    const tuts = [\n      { id: 'ev', name: 'Escola Virtual', sub: 'Fundação Bradesco · cursos gratuitos', url: 'https://www.ev.org.br/', host: 'ev.org.br', free: 'Cursos gratuitos, segundo o site', cert: 'Certificado conforme regras de cada curso',\n        about: 'A Escola Virtual é uma plataforma da Fundação Bradesco com cursos online gratuitos sobre temas como informática, finanças, atendimento e administração.',\n        steps: [\n          ['Onde encontrar', 'Acesse ev.org.br pelo botão “Acessar plataforma”. O catálogo fica na seção de cursos do site.'],\n          ['Pesquisar por assunto', 'Use a busca ou navegue pelas áreas do catálogo (por exemplo, informática ou finanças).'],\n          ['Saber se é gratuito', 'O site apresenta os cursos como gratuitos. Mesmo assim, leia a página do curso para confirmar.'],\n          ['Carga horária e requisitos', 'Na página de cada curso aparecem a carga horária, o conteúdo e os requisitos, como a necessidade de fazer cadastro.'],\n          ['Certificado e custo', 'Segundo o site, quem atinge ao menos 70% na avaliação final pode imprimir o Certificado de Conclusão; cursos sem avaliação final emitem certificado de participação.'],\n          ['Inscrição', 'Crie seu cadastro e escolha “inscrever-se” no curso desejado. Guarde seu login e senha.'],\n          ['Acessar as aulas e concluir', 'Entre na área do aluno, assista aos conteúdos e faça as atividades e a avaliação final, quando houver.'],\n          ['Emitir o certificado', 'Ao cumprir as regras do curso, procure a opção de certificado na área do aluno e salve o arquivo.']\n        ], note: 'As informações sobre certificado vêm do site da Escola Virtual e podem mudar. Confira sempre no site oficial.' },\n      { id: 'khan', name: 'Khan Academy', sub: 'Matemática e ciências · gratuito', url: 'https://pt.khanacademy.org/', host: 'pt.khanacademy.org', free: 'Plataforma gratuita', cert: 'Em geral, sem certificado',\n        about: 'Plataforma educacional sem fins lucrativos com videoaulas e exercícios em português, principalmente de matemática e ciências.',\n        steps: [\n          ['Onde encontrar', 'Acesse pt.khanacademy.org. Os conteúdos ficam organizados por disciplina e nível.'],\n          ['Pesquisar por assunto', 'Use a barra de busca ou escolha a disciplina e depois a unidade.'],\n          ['Saber se é gratuito', 'A plataforma se apresenta como gratuita. Cadastro é opcional, mas permite salvar o progresso.'],\n          ['Carga horária e requisitos', 'Não há carga horária fixa: você avança por unidades. Confira os pré-requisitos sugeridos no começo de cada unidade.'],\n          ['Certificado e custo', 'Em geral, a plataforma não emite certificado de conclusão. Verifique no site se isso mudou.'],\n          ['Inscrição', 'Crie uma conta gratuita (opcional) para acompanhar seu progresso e retomar de onde parou.'],\n          ['Acessar as aulas e concluir', 'Assista aos vídeos e resolva os exercícios de cada unidade até dominar o conteúdo.'],\n          ['Comprovar seu estudo', 'Sem certificado, guarde seu histórico de progresso e anote o que aprendeu no seu caderno ou no Livro Aberto.']\n        ], note: 'Os conteúdos podem ser reorganizados pela plataforma. Se não encontrar um tópico, tente palavras diferentes na busca.' },\n      { id: 'sebrae', name: 'Sebrae', sub: 'Empreendedorismo e gestão', url: 'https://loja.sebrae.com.br/cursos/cursos-online', host: 'loja.sebrae.com.br', free: 'Há cursos gratuitos e pagos: confira', cert: 'Depende do curso',\n        about: 'O Sebrae oferece cursos online sobre empreendedorismo, finanças e gestão. O catálogo mistura conteúdos gratuitos e pagos, então vale conferir cada página.',\n        steps: [\n          ['Onde encontrar', 'Acesse a página de cursos online do Sebrae pelo botão “Acessar plataforma”.'],\n          ['Pesquisar por assunto', 'Pesquise por temas como vendas, finanças ou planejamento, ou use os filtros disponíveis.'],\n          ['Saber se é gratuito', 'Procure pela indicação de preço ou de “gratuito” em cada curso. Se houver valor, ele aparece antes da inscrição.'],\n          ['Carga horária e requisitos', 'A página do curso mostra a duração e para quem ele é indicado.'],\n          ['Certificado e custo', 'Verifique na descrição se o curso emite certificado e quais são as condições, como a porcentagem mínima de conclusão.'],\n          ['Inscrição', 'Faça login ou crie seu cadastro e siga as etapas de inscrição do curso escolhido.'],\n          ['Acessar as aulas e concluir', 'Entre na área “meus cursos” (ou equivalente) e conclua os módulos no seu ritmo.'],\n          ['Emitir o certificado', 'Se o curso emitir, o certificado costuma ser liberado depois da conclusão. Siga as instruções da plataforma.']\n        ], note: 'A organização do site do Sebrae pode mudar. Em caso de dúvida, use os canais de atendimento do próprio Sebrae.' },\n      { id: 'coursera', name: 'Coursera', sub: 'Cursos de universidades e empresas', url: 'https://www.coursera.org/', host: 'coursera.org', free: 'Alguns cursos têm acesso gratuito parcial', cert: 'Em geral, pago (existe auxílio financeiro)',\n        about: 'Plataforma internacional com cursos de universidades e empresas. Muitos conteúdos têm opções gratuitas, mas o certificado costuma ser pago.',\n        steps: [\n          ['Onde encontrar', 'Acesse coursera.org e use o campo de busca no topo da página.'],\n          ['Pesquisar por assunto', 'Pesquise o tema e filtre por idioma (por exemplo, português) e por nível.'],\n          ['Saber se é gratuito', 'Abra a página do curso e leia as opções de acesso. Procure pela possibilidade de ver ou “auditar” o curso sem pagar, quando disponível.'],\n          ['Carga horária e requisitos', 'A página do curso mostra a duração estimada, o nível e os pré-requisitos.'],\n          ['Certificado e custo', 'O certificado geralmente exige pagamento. Verifique a opção de auxílio financeiro, quando oferecida.'],\n          ['Inscrição', 'Crie uma conta e clique no botão de inscrição, escolhendo a opção de acesso que você deseja.'],\n          ['Acessar as aulas e concluir', 'Acompanhe os módulos e atividades. No acesso gratuito pode haver limites, como atividades bloqueadas.'],\n          ['Emitir o certificado', 'Se você tiver direito a certificado, ele aparece no seu perfil ou no próprio curso após a conclusão.']\n        ], note: 'As opções de gratuidade mudam de curso para curso e ao longo do tempo. Leia com atenção antes de informar dados de pagamento.' },\n      { id: 'edx', name: 'edX', sub: 'Cursos universitários online', url: 'https://www.edx.org/', host: 'edx.org', free: 'Algumas modalidades gratuitas, conforme o curso', cert: 'Em geral, pago',\n        about: 'Plataforma de cursos online de universidades e instituições. A maior parte do conteúdo está em inglês, com algumas opções em outros idiomas.',\n        steps: [\n          ['Onde encontrar', 'Acesse edx.org e use a busca para encontrar cursos por assunto.'],\n          ['Pesquisar por assunto', 'Filtre por tema, idioma e nível. Use as palavras-chave em inglês para ampliar os resultados.'],\n          ['Saber se é gratuito', 'Na página do curso, procure pela modalidade gratuita (muitas vezes chamada de acesso de auditoria), quando disponível.'],\n          ['Carga horária e requisitos', 'Veja a duração, o esforço semanal estimado e os pré-requisitos.'],\n          ['Certificado e custo', 'O certificado verificado geralmente é pago. Veja o valor antes de decidir.'],\n          ['Inscrição', 'Crie uma conta e escolha a modalidade de inscrição.'],\n          ['Acessar as aulas e concluir', 'Acompanhe as semanas do curso no seu painel e faça as atividades.'],\n          ['Emitir o certificado', 'Se tiver adquirido o certificado, ele fica disponível no seu perfil depois de cumprir os requisitos.']\n        ], note: 'Verifique sempre o idioma do curso antes de começar e se a modalidade gratuita ainda está disponível.' },\n      { id: 'evg', name: 'Escola Virtual de Governo', sub: 'Enap · cursos sobre administração pública', url: 'https://www.escolavirtual.gov.br/', host: 'escolavirtual.gov.br', free: 'Confira em cada curso', cert: 'Conforme regras de cada curso',\n        about: 'Portal do governo federal com cursos e programas de capacitação. Muitos conteúdos são voltados a servidores públicos, mas há opções abertas ao público: confira o público-alvo de cada curso.',\n        steps: [\n          ['Onde encontrar', 'Acesse escolavirtual.gov.br. O catálogo está na página inicial e nas seções de cursos.'],\n          ['Pesquisar por assunto', 'Use a busca ou os filtros para achar temas como gestão, comunicação, atendimento e tecnologia.'],\n          ['Saber se é gratuito', 'Leia a página do curso e confira se há cobrança. Verifique também se ele é aberto ao público em geral.'],\n          ['Carga horária e requisitos', 'A página do curso informa a carga horária, o público-alvo e se há pré-requisitos.'],\n          ['Certificado e custo', 'Verifique as regras de certificação do curso, como o percentual mínimo de conclusão.'],\n          ['Inscrição', 'Faça login pelo botão “Entrar” e siga as etapas de inscrição. Pode ser pedida uma conta gov.br.'],\n          ['Acessar as aulas e concluir', 'Acesse o curso pelo seu painel e complete as atividades dentro do prazo indicado.'],\n          ['Emitir e validar o certificado', 'Depois de concluir, baixe o certificado na plataforma. O portal também tem uma área para validação de documentos.']\n        ], note: 'Os requisitos de acesso variam por curso. Em caso de dúvida, procure a seção de ajuda do portal.' }\n    ];\n\n    this._D = { COLORS, IC, CERT, courses, videos, shorts, books, tuts };\n    return this._D;\n  }\n\n  /* =====================================================================\n     ESTADO\n     ===================================================================== */\n  get s() {\n    return Object.assign({\n      page: 'home', courseId: null, menuOpen: false, toast: '',\n      q: '', grp: 'all', lvl: 'all', dur: 'all', hq: '',\n      vq: '', vcat: 'all', vlvl: 'all',\n      bq: '', bgrp: 'all', bcat: 'all', btype: 'all',\n      scat: 'all', lastShort: null, tut: 'ev',\n      done: {}, started: {}, favs: {}, hist: [], acct: null, logged: false,\n      authTab: 'login', f: { name: '', email: '', pass: '' }, err: {}, authErrBox: '', certId: null\n    }, this.state || {}, this._pend || {});\n  }\n\n  componentDidMount() {\n    try {\n      const raw = window.localStorage.getItem('goit-demo-v1');\n      if (raw) {\n        const o = JSON.parse(raw);\n        const patch = {};\n        ['done', 'started', 'favs', 'hist', 'acct', 'logged'].forEach((k) => { if (o && o[k] !== undefined) patch[k] = o[k]; });\n        this.up(patch);\n      }\n    } catch (e) { /* armazenamento indisponível: tudo continua funcionando em memória */ }\n  }\n\n  up(patch) {\n    this._pend = Object.assign({}, this._pend, patch);\n    this.setState(patch);\n    try {\n      const n = this.s;\n      window.localStorage.setItem('goit-demo-v1', JSON.stringify({ done: n.done, started: n.started, favs: n.favs, hist: n.hist, acct: n.acct, logged: n.logged }));\n    } catch (e) { /* sem armazenamento */ }\n  }\n\n  flash(msg) {\n    this.up({ toast: msg });\n    clearTimeout(this._tt);\n    this._tt = setTimeout(() => this.up({ toast: '' }), 4200);\n  }\n\n  go(page, extra) {\n    this.up(Object.assign({ page, menuOpen: false }, extra || {}));\n    try { window.scrollTo(0, 0); document.documentElement.scrollTop = 0; } catch (e) {}\n  }\n\n  track(kind, title) {\n    const h = (this.s.hist || []).slice();\n    if (h.length && h[0].t === title && h[0].kind === kind) return;\n    h.unshift({ kind, t: title, at: Date.now() });\n    this.up({ hist: h.slice(0, 30) });\n  }\n\n  toggleFav(key, title) {\n    const favs = Object.assign({}, this.s.favs);\n    if (favs[key]) { delete favs[key]; this.up({ favs }); this.flash('Removido dos favoritos.'); }\n    else { favs[key] = title; this.up({ favs }); this.flash('Adicionado aos favoritos.'); }\n  }\n\n  norm(x) { return String(x || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }\n\n  progress(c) {\n    const done = this.s.done;\n    let total = 0, n = 0;\n    c.m.forEach((m, mi) => m[1].forEach((l, li) => { total++; if (done[c.id + '.' + mi + '.' + li]) n++; }));\n    return { total, n, pct: total ? Math.round((n / total) * 100) : 0 };\n  }\n\n  chips(opts, cur, key) {\n    return opts.map((o) => ({ label: o[1], active: cur === o[0], cls: cur === o[0] ? 'chip on' : 'chip', pick: () => this.up({ [key]: o[0] }) }));\n  }\n\n  /* =====================================================================\n     RENDER\n     ===================================================================== */\n  renderVals() {\n    const D = this.D(), s = this.s;\n    const favOf = (key, title) => ({\n      isFav: !!s.favs[key],\n      heartFill: s.favs[key] ? '#A8472A' : 'none',\n      favLabel: (s.favs[key] ? 'Remover dos favoritos: ' : 'Favoritar: ') + title,\n      fav: () => this.toggleFav(key, title)\n    });\n\n    // ---------- navegação ----------\n    const NAV = [['home', 'Início'], ['courses', 'Cursos'], ['videos', 'Videoaulas'], ['books', 'Livros'], ['shorts', 'Aprenda em minutos'], ['tutorials', 'Como encontrar cursos'], ['about', 'Sobre o Livro Aberto']];\n    const curPage = s.page === 'course' ? 'courses' : s.page;\n    const nav = NAV.map((n) => ({ label: n[1], cur: curPage === n[0] ? 'page' : 'false', cls: curPage === n[0] ? 'navbtn on' : 'navbtn', go: () => this.go(n[0]) }));\n    const footA = nav.filter((n, i) => i < 4 || i === 0);\n    const footB = nav.filter((n, i) => i >= 4);\n    footB.push({ label: 'Área do estudante', go: () => this.go('student') });\n\n    // ---------- cursos ----------\n    const GROUP = { escolar: 'Escolar', extra: 'Profissionalizante' };\n    const courseView = (c) => {\n      const p = this.progress(c);\n      const status = p.pct >= 100 ? 'Concluído' : (p.n > 0 || s.started[c.id]) ? 'Em andamento' : 'Não iniciado';\n      const statusCls = p.pct >= 100 ? 'pill pill-ok' : status === 'Em andamento' ? 'pill pill-run' : 'pill pill-no';\n      const startLabel = p.pct >= 100 ? 'Rever curso' : status === 'Em andamento' ? 'Continuar' : 'Iniciar curso';\n      return Object.assign({\n        id: c.id, t: c.t, d: c.d, lvl: c.lvl, hs: c.h + ' h', mod: c.mod,\n        color: D.COLORS[c.c], icon: D.IC[c.ic], groupLabel: GROUP[c.g],\n        certShort: D.CERT[c.cert].s, pct: p.pct, status, statusCls, startLabel,\n        doneText: p.n + ' de ' + p.total + ' aulas concluídas',\n        open: () => { this.track('Curso', c.t); this.go('course', { courseId: c.id }); },\n        start: () => { const st = Object.assign({}, this.s.started); st[c.id] = true; this.track('Curso', c.t); this.go('course', { courseId: c.id, started: st }); this.flash('Curso iniciado. Boa aula!'); }\n      }, favOf('course:' + c.id, c.t));\n    };\n    const ql = this.norm(s.q);\n    const durOk = (h) => s.dur === 'all' || (s.dur === 'ate10' && h <= 10) || (s.dur === '10a20' && h > 10 && h <= 20) || (s.dur === 'mais20' && h > 20);\n    const filtered = D.courses.filter((c) =>\n      (s.grp === 'all' || c.g === s.grp) && (s.lvl === 'all' || c.lvl === s.lvl) && durOk(c.h) &&\n      (!ql || this.norm(c.t + ' ' + c.d + ' ' + c.area).indexOf(ql) >= 0));\n    const coursesEsc = filtered.filter((c) => c.g === 'escolar').map(courseView);\n    const coursesExt = filtered.filter((c) => c.g === 'extra').map(courseView);\n    const featured = ['mat', 'inf', 'fin', 'web'].map((id) => courseView(D.courses.find((c) => c.id === id)));\n\n    // ---------- detalhe do curso ----------\n    let cd = {};\n    const cur = D.courses.find((c) => c.id === s.courseId);\n    if (cur) {\n      const p = this.progress(cur);\n      const base = courseView(cur);\n      const ext = cur.ext;\n      cd = Object.assign({}, base, {\n        lessonsText: p.total + ' aulas', pctText: p.pct + '%', complete: p.pct >= 100,\n        certShort: D.CERT[cur.cert].s, certLong: D.CERT[cur.cert].l,\n        hasExt: !!ext, noExt: !ext,\n        extLabel: ext ? ext.l : '', extUrl: ext ? ext.u : '', extNote: ext ? ext.n : '',\n        extTrack: () => this.track('Site externo', ext ? ext.l : ''),\n        favText: s.favs['course:' + cur.id] ? 'Remover dos favoritos' : 'Favoritar este curso',\n        startLabel: p.pct >= 100 ? 'Curso concluído' : p.n > 0 ? 'Continuar estudando' : 'Começar este curso',\n        startOrNext: () => {\n          if (p.pct >= 100) { this
