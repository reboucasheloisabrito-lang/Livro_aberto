  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

=\"actions\">\n                <button class=\"btn btn-blue btn-sm\" sc-camel-on-click=\"{{c.open}}\">Ver detalhes<\u002Fbutton>\n                <button class=\"heart\" sc-camel-on-click=\"{{c.fav}}\" aria-pressed=\"{{c.isFav}}\" aria-label=\"{{c.favLabel}}\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"fill:{{c.heartFill}}\"><path d=\"M12 20s-7-4.500-7-10a4 4 0 0 1 7-2.500A4 4 0 0 1 19 10c0 5.500-7 10-7 10z\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"sec sec-alt\">\n    <div class=\"wrap\">\n      <div class=\"sec-head\">\n        <div><p class=\"kicker\">Videoaulas e conteúdos rápidos<\u002Fp><h2>Para o intervalo do trabalho ou a noite toda<\u002Fh2><\u002Fdiv>\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n          <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{goVideos}}\">Videoaulas<\u002Fbutton>\n          <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{goShorts}}\">Aprenda em minutos<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"grid-3\">\n        <sc-for list=\"{{homeVideos}}\" as=\"v\" hint-placeholder-count=\"3\">\n          <article class=\"card\">\n            <div class=\"thumb\" style=\"background-color:{{v.color}}\">\n              <span class=\"badge cover-tag\">{{v.cat}}<\u002Fspan>\n              <span class=\"play\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M7 4.500v15l13-7.500z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n              <span class=\"topic\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"{{v.icon}}\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"card-body\">\n              <h3>{{v.t}}<\u002Fh3>\n              <p class=\"small\">Canal: {{v.ch}}<\u002Fp>\n              <div class=\"actions\">\n                <a class=\"btn btn-blue btn-sm\" href=\"{{v.url}}\" target=\"_blank\" rel=\"noopener noreferrer\" sc-camel-on-click=\"{{v.watch}}\">Assistir no YouTube\n                  <svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M7 17L17 7M8 7h9v9\"><\u002Fpath><\u002Fsvg><\u002Fa>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <h3 style=\"font-size:24px;margin:40px 0 18px\">Aprenda em minutos<\u002Fh3>\n      <div class=\"grid-3\">\n        <sc-for list=\"{{homeShorts}}\" as=\"s\" hint-placeholder-count=\"3\">\n          <article class=\"card\"><div class=\"card-body\">\n            <div class=\"meta\"><span class=\"pill\">{{s.cat}}<\u002Fspan><span class=\"pill\">{{s.dur}}<\u002Fspan><\u002Fdiv>\n            <h3>{{s.t}}<\u002Fh3>\n            <p>{{s.d}}<\u002Fp>\n            <p class=\"small\">Canal: <strong>{{s.ch}}<\u002Fstrong><\u002Fp>\n            <div class=\"actions\"><a class=\"btn btn-primary btn-sm\" href=\"{{s.url}}\" target=\"_blank\" rel=\"noopener noreferrer\" sc-camel-on-click=\"{{s.watch}}\">Assistir<\u002Fa><\u002Fdiv>\n          <\u002Fdiv><\u002Farticle>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"sec\">\n    <div class=\"wrap\">\n      <div class=\"sec-head\">\n        <div><p class=\"kicker\">Biblioteca<\u002Fp><h2>Livros recomendados<\u002Fh2><\u002Fdiv>\n        <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{goBooks}}\">Abrir a biblioteca<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"bk-grid\">\n        <sc-for list=\"{{homeBooks}}\" as=\"b\" hint-placeholder-count=\"4\">\n          <article class=\"card bk\">\n            <div class=\"bk-cover\" style=\"background-color:{{b.color}}\"><b>{{b.t}}<\u002Fb><span>{{b.au}}<\u002Fspan><\u002Fdiv>\n            <div class=\"bk-info\">\n              <h3>{{b.t}}<\u002Fh3>\n              <p class=\"small\">{{b.au}} · {{b.cat}}<\u002Fp>\n              <p>{{b.d}}<\u002Fp>\n              <div class=\"bk-links\">\n                <button class=\"btn btn-ghost btn-sm\" sc-camel-on-click=\"{{b.more}}\">Ver na biblioteca<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"sec sec-alt benef\">\n    <div class=\"wrap\">\n      <p class=\"kicker\">Por que o Livro Aberto<\u002Fp>\n      <h2 style=\"margin-bottom:32px;font-size:clamp(28px,4vw,40px)\">Feito para a rotina real<\u002Fh2>\n      <div class=\"grid-3\">\n        <div class=\"card\"><div class=\"card-body\">\n          <div class=\"icon-box\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18zM12 7v5l3 2\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <h3>Flexibilidade<\u002Fh3><p>Estude 10 minutos ou duas horas. As aulas são divididas em etapas curtas e o seu progresso fica guardado para você retomar de onde parou.<\u002Fp>\n        <\u002Fdiv><\u002Fdiv>\n        <div class=\"card\"><div class=\"card-body\">\n          <div class=\"icon-box\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M4 4.500A1.500 1.500 0 0 1 5.500 3H19v15H5.500A1.500 1.500 0 0 0 4 19.500v-15zM4 19.500A1.500 1.500 0 0 0 5.500 21H19v-3\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <h3>Variedade de conteúdos<\u002Fh3><p>Disciplinas escolares, cursos profissionalizantes, videoaulas, livros de domínio público e tutoriais para achar cursos gratuitos em outras instituições.<\u002Fp>\n        <\u002Fdiv><\u002Fdiv>\n        <div class=\"card\"><div class=\"card-body\">\n          <div class=\"icon-box\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3l2.500 5.500 6 .8-4.400 4.100 1.100 6L12 16.500 6.800 19.400l1.100-6L3.500 9.300l6-.8z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <h3>Autonomia<\u002Fh3><p>Você escolhe o assunto, o nível e o ritmo. Favorite o que quiser guardar e acompanhe sua evolução na área do estudante.<\u002Fp>\n        <\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"text-align:center;margin-top:40px\"><button class=\"btn btn-primary btn-lg\" sc-camel-on-click=\"{{goCourses}}\">Explorar os cursos<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<!-- ============ CURSOS (catálogo) ============ -->\n<sc-if value=\"{{isCourses}}\" hint-placeholder-val=\"{{ false }}\">\n  <section class=\"phead\">\n    <div class=\"wrap\">\n      <p class=\"kicker\">Catálogo<\u002Fp>\n      <h1>Cursos<\u002Fh1>\n      <p class=\"lead\">Cursos escolares e profissionalizantes para estudar no seu ritmo. Use a busca e os filtros para achar o que combina com o seu tempo.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <div class=\"page\"><div class=\"wrap\">\n    <div class=\"notice notice-blue\">\n      <svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18zM12 11v5M12 8h.01\"><\u002Fpath><\u002Fsvg>\n      <p><strong>Cursos demonstrativos.<\u002Fstrong> Os módulos e as aulas abaixo servem para simular a experiência de estudo (progresso, aulas concluídas, favoritos). Quando existe, o curso indica um link para conteúdo gratuito de uma instituição ou plataforma externa. O Livro Aberto não tem parceria com essas instituições e não emite certificados oficiais.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"panel\">\n      <div>\n        <label for=\"cq\" style=\"font-weight:700;display:block;margin-bottom:6px\">Buscar curso<\u002Flabel>\n        <div class=\"field\">\n          <svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M11 4a7 7 0 1 0 0 14a7 7 0 0 0 0-14zM21 21l-5-5\"><\u002Fpath><\u002Fsvg>\n          <input id=\"cq\" type=\"search\" placeholder=\"Digite um assunto: matemática, excel, atendimento…\" value=\"{{q}}\" sc-camel-on-change=\"{{onQ}}\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"frow\"><span class=\"flabel\">Categoria<\u002Fspan>\n        <sc-for list=\"{{chipsGrp}}\" as=\"ch\" hint-placeholder-count=\"3\"><button class=\"{{ch.cls}}\" sc-camel-on-click=\"{{ch.pick}}\" aria-pressed=\"{{ch.active}}\">{{ch.label}}<\u002Fbutton><\u002Fsc-for>\n      <\u002Fdiv>\n      <div class=\"frow\"><span class=\"flabel\">Nível<\u002Fspan>\n        <sc-for list=\"{{chipsLvl}}\" as=\"ch\" hint-placeholder-count=\"4\"><button class=\"{{ch.cls}}\" sc-camel-on-click=\"{{ch.pick}}\" aria-pressed=\"{{ch.active}}\">{{ch.label}}<\u002Fbutton><\u002Fsc-for>\n      <\u002Fdiv>\n      <div class=\"frow\"><span class=\"flabel\">Duração<\u002Fspan>\n        <sc-for list=\"{{chipsDur}}\" as=\"ch\" hint-placeholder-count=\"4\"><button class=\"{{ch.cls}}\" sc-camel-on-click=\"{{ch.pick}}\" aria-pressed=\"{{ch.active}}\">{{ch.label}}<\u002Fbutton><\u002Fsc-for>\n      <\u002Fdiv>\n      <div class=\"frow\" style=\"justify-content:space-between\">\n        <p class=\"small\" role=\"status\" aria-live=\"polite\"><strong>{{courseCountText}}<\u002Fstrong><\u002Fp>\n        <button class=\"btn-link\" sc-camel-on-click=\"{{clearCourseFilters}}\">Limpar busca e filtros<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{noCourses}}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"empty\">\n        <h3>Nenhum curso encontrado<\u002Fh3>\n        <p>Não achamos cursos com essa busca e esses filtros. Tente outra palavra ou remova algum filtro.<\u002Fp>\n        <button class=\"btn btn-blue\" sc-camel-on-click=\"{{clearCourseFilters}}\">Mostrar todos os cursos<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{hasEsc}}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"group-title\"><h2>Cursos escolares<\u002Fh2><span><\u002Fspan><\u002Fdiv>\n      <div class=\"grid\">\n        <sc-for list=\"{{coursesEsc}}\" as=\"c\" hint-placeholder-count=\"3\">\n          <article class=\"card\">\n            <div class=\"cover\" style=\"background-color:{{c.color}}\">\n              <svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"{{c.icon}}\"><\u002Fpath><\u002Fsvg>\n              <span class=\"cover-tag\">{{c.groupLabel}}<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"card-body\">\n              <h3>{{c.t}}<\u002Fh3>\n              <p>{{c.d}}<\u002Fp>\n              <div class=\"meta\">\n                <span class=\"pill\">{{c.lvl}}<\u002Fspan><span class=\"pill\">{{c.hs}}<\u002Fspan><span class=\"pill\">{{c.mod}}<\u002Fspan>\n              <\u002Fdiv>\n              <p class=\"small\"><strong>Certificado:<\u002Fstrong> {{c.certShort}}<\u002Fp>\n              <div class=\"meta\"><span class=\"{{c.statusCls}}\">{{c.status}}<\u002Fspan><\u002Fdiv>\n              <progress class=\"prog\" value=\"{{c.pct}}\" max=\"100\" aria-label=\"Progresso em {{c.t}}\">{{c.pct}}%<\u002Fprogress>\n              <div class=\"actions\">\n                <button class=\"btn btn-blue btn-sm\" sc-camel-on-click=\"{{c.open}}\">Ver detalhes<\u002Fbutton>\n                <button class=\"btn btn-primary btn-sm\" sc-camel-on-click=\"{{c.start}}\">{{c.startLabel}}<\u002Fbutton>\n                <button class=\"heart\" sc-camel-on-click=\"{{c.fav}}\" aria-pressed=\"{{c.isFav}}\" aria-label=\"{{c.favLabel}}\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"fill:{{c.heartFill}}\"><path d=\"M12 20s-7-4.500-7-10a4 4 0 0 1 7-2.500A4 4 0 0 1 19 10c0 5.500-7 10-7 10z\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{hasExt}}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"group-title\"><h2>Extracurriculares e profissionalizantes<\u002Fh2><span><\u002Fspan><\u002Fdiv>\n      <div class=\"grid\">\n        <sc-for list=\"{{coursesExt}}\" as=\"c\" hint-placeholder-count=\"3\">\n          <article class=\"card\">\n            <div class=\"cover\" style=\"background-color:{{c.color}}\">\n              <svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"{{c.icon}}\"><\u002Fpath><\u002Fsvg>\n              <span class=\"cover-tag\">{{c.groupLabel}}<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"card-body\">\n              <h3>{{c.t}}<\u002Fh3>\n              <p>{{c.d}}<\u002Fp>\n              <div class=\"meta\">\n                <span class=\"pill\">{{c.lvl}}<\u002Fspan><span class=\"pill\">{{c.hs}}<\u002Fspan><span class=\"pill\">{{c.mod}}<\u002Fspan>\n              <\u002Fdiv>\n              <p class=\"small\"><strong>Certificado:<\u002Fstrong> {{c.certShort}}<\u002Fp>\n              <div class=\"meta\"><span class=\"{{c.statusCls}}\">{{c.status}}<\u002Fspan><\u002Fdiv>\n              <progress class=\"prog\" value=\"{{c.pct}}\" max=\"100\" aria-label=\"Progresso em {{c.t}}\">{{c.pct}}%<\u002Fprogress>\n              <div class=\"actions\">\n                <button class=\"btn btn-blue btn-sm\" sc-camel-on-click=\"{{c.open}}\">Ver detalhes<\u002Fbutton>\n                <button class=\"btn btn-primary btn-sm\" sc-camel-on-click=\"{{c.start}}\">{{c.startLabel}}<\u002Fbutton>\n                <button class=\"heart\" sc-camel-on-click=\"{{c.fav}}\" aria-pressed=\"{{c.isFav}}\" aria-label=\"{{c.favLabel}}\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"fill:{{c.heartFill}}\"><path d=\"M12 20s-7-4.500-7-10a4 4 0 0 1 7-2.500A4 4 0 0 1 19 10c0 5.500-7 10-7 10z\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv><\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ DETALHE DO CURSO ============ -->\n<sc-if value=\"{{isCourse}}\" hint-placeholder-val=\"{{ false }}\">\n  <section class=\"phead\">\n    <div class=\"wrap\">\n      <div class=\"crumbs\"><button sc-camel-on-click=\"{{goCourses}}\">Cursos<\u002Fbutton><span aria-hidden=\"true\">/<\u002Fspan><span>{{cd.t}}<\u002Fspan><\u002Fdiv>\n      <p class=\"kicker\">{{cd.groupLabel}}<\u002Fp>\n      <h1>{{cd.t}}<\u002Fh1>\n      <p class=\"lead\">{{cd.d}}<\u002Fp>\n      <div class=\"meta\" style=\"margin-top:18px\">\n        <span class=\"pill\">{{cd.lvl}}<\u002Fspan><span class=\"pill\">{{cd.hs}} (estimativa)<\u002Fspan><span class=\"pill\">{{cd.mod}}<\u002Fspan><span class=\"pill\">{{cd.lessonsText}}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <div class=\"page\"><div class=\"wrap cd-grid\">\n    <div>\n      <h2 style=\"font-size:28px;margin-bottom:6px\">Conteúdo programático<\u002Fh2>\n      <p class=\"small\" style=\"margin-bottom:20px\">Aulas organizadas por etapas. Marque cada aula como concluída para acompanhar o progresso.<\u002Fp>\n      <sc-for list=\"{{cd.modules}}\" as=\"m\" hint-placeholder-count=\"3\">\n        <section class=\"mod\">\n          <h3><span>{{m.label}}<\u002Fspan><small>{{m.countText}}<\u002Fsmall><\u002Fh3>\n          <sc-for list=\"{{m.lessons}}\" as=\"l\" hint-placeholder-count=\"3\">\n            <div class=\"{{l.cls}}\">\n              <svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"color:#1F6F7F\"><path d=\"{{l.icon}}\"><\u002Fpath><\u002Fsvg>\n              <div class=\"lt\">{{l.t}}<small>{{l.state}}<\u002Fsmall><\u002Fdiv>\n              <button class=\"{{l.btnCls}}\" sc-camel-on-click=\"{{l.toggle}}\" aria-pressed=\"{{l.done}}\">{{l.btnLabel}}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsection>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <aside style=\"display:flex;flex-direction:column;gap:20px\">\n      <div class=\"side-card\">\n        <h3>Seu progresso<\u002Fh3>\n        <div class=\"big-pct\">{{cd.pctText}}<\u002Fdiv>\n        <progress class=\"prog\" value=\"{{cd.pct}}\" max=\"100\" aria-label=\"Progresso neste curso\">{{cd.pct}}%<\u002Fprogress>\n        <p class=\"small\">{{cd.doneText}}<\u002Fp>\n        <button class=\"btn btn-primary\" sc-camel-on-click=\"{{cd.startOrNext}}\">{{cd.startLabel}}<\u002Fbutton>\n        <sc-if value=\"{{cd.complete}}\" hint-placeholder-val=\"{{ false }}\">\n          <button class=\"btn btn-blue\" sc-camel-on-click=\"{{cd.showCert}}\">Ver certificado demonstrativo<\u002Fbutton>\n        <\u002Fsc-if>\n        <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{cd.fav}}\" aria-pressed=\"{{cd.isFav}}\">{{cd.favText}}<\u002Fbutton>\n        <button class=\"btn-link\" sc-camel-on-click=\"{{cd.reset}}\">Zerar progresso deste curso<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"side-card\">\n        <h3>Certificação<\u002Fh3>\n        <p class=\"small\"><strong>{{cd.certShort}}<\u002Fstrong><\u002Fp>\n        <p class=\"small\">{{cd.certLong}}<\u002Fp>\n        <p class=\"small\"><strong>Importante:<\u002Fstrong> o Livro Aberto é um protótipo e não emite certificados oficiais. Ao concluir todas as aulas, você pode gerar apenas um certificado <em>demonstrativo<\u002Fem>, sem validade. A emissão de certificados reais depende das condições da plataforma ou do provedor responsável.<\u002Fp>\n      <\u002Fdiv>\n      <sc-if value=\"{{cd.hasExt}}\" hint-placeholder-val=\"{{ true }}\">\n        <div class=\"side-card\">\n          <h3>Conteúdo gratuito externo<\u002Fh3>\n          <p class=\"small\">{{cd.extNote}}<\u002Fp>\n          <a class=\"btn btn-blue\" href=\"{{cd.extUrl}}\" target=\"_blank\" rel=\"noopener noreferrer\" sc-camel-on-click=\"{{cd.extTrack}}\">{{cd.extLabel}}\n            <svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M7 17L17 7M8 7h9v9\"><\u002Fpath><\u002Fsvg><\u002Fa>\n          <p class=\"small\">Você será direcionado para outro site. Requisitos de inscrição e certificação podem variar.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{cd.noExt}}\" hint-placeholder-val=\"{{ false }}\">\n        <div class=\"side-card\">\n          <h3>Quer estudar com conteúdo real?<\u002Fh3>\n          <p class=\"small\">Nesta versão não há um curso externo indicado para este tema. Veja nos tutoriais como procurar cursos gratuitos em outras plataformas.<\u002Fp>\n          <button class=\"btn btn-blue\" sc-camel-on-click=\"{{goTutorials}}\">Como encontrar cursos<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Faside>\n  <\u002Fdiv><\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ SOBRE ============ -->\n<sc-if value=\"{{isAbout}}\" hint-placeholder-val=\"{{ false }}\">\n  <section class=\"phead\">\n    <div class=\"wrap\">\n      <p class=\"kicker\">Sobre o Livro Aberto<\u002Fp>\n      <h1>Parar de estudar não é parar de querer aprender<\u002Fh1>\n      <p class=\"lead\">Conheça a ideia por trás do projeto, o problema que ele quer ajudar a resolver e as pessoas para quem ele foi pensado.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <div class=\"page\"><div class=\"wrap\">\n    <div class=\"prose\">\n      <p class=\"kicker\">Como surgiu a ideia<\u002Fp>\n      <h2 style=\"font-size:clamp(26px,3.4vw,36px);margin-bottom:18px\">Do cansaço no fim do dia à pergunta: e se estudar coubesse na minha rotina?<\u002Fh2>\n      <p>Muita gente conhece alguém que parou de estudar para trabalhar, cuidar da família ou ajudar em casa. Às vezes foi um semestre, às vezes foram anos. A vontade de aprender continuou ali, só que o dia ficou pequeno demais.<\u002Fp>\n      <p>O Livro Aberto nasceu desse olhar: em vez de exigir uma rotina perfeita, a educação pode acompanhar a rotina que a pessoa realmente tem. Foi assim que surgiu a ideia de reunir em um só lugar cursos, videoaulas, livros e tutoriais, para que ninguém precise passar horas procurando por onde começar.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"orn\" aria-hidden=\"true\" style=\"margin-top:36px\"><i><\u002Fi><\u002Fdiv>\n\n    <div class=\"about-grid\">\n      <article class=\"card\"><div class=\"card-body\">\n        <div class=\"icon-box\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18zM12 7v6M12 16.500h.01\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>O problema que queremos ajudar a resolver<\u002Fh3>\n        <p>Conciliar trabalho, responsabilidades pessoais e estudos é difícil. Quando a pessoa interrompe a formação, os conteúdos úteis ficam espalhados, o caminho parece longo e não está claro por onde recomeçar. O Livro Aberto tenta reduzir esse custo de começar.<\u002Fp>\n      <\u002Fdiv><\u002Farticle>\n      <article class=\"card\"><div class=\"card-body\">\n        <div class=\"icon-box\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 3.500-6 8-6s8 2 8 6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>Para quem é<\u002Fh3>\n        <p>Para jovens e adultos que precisaram pausar os estudos por causa do trabalho, da falta de tempo ou de outras dificuldades, mas querem retomar, concluir uma etapa, aprender uma habilidade nova ou melhorar suas oportunidades profissionais.<\u002Fp>\n      <\u002Fdiv><\u002Farticle>\n      <article class=\"card\"><div class=\"card-body\">\n        <div class=\"icon-box\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18zM12 8a4 4 0 1 0 0 8a4 4 0 0 0 0-8zM12 12h.01\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>Nossa missão<\u002Fh3>\n        <p>Facilitar o acesso à educação, reunindo recursos educativos confiáveis em um só lugar e permitindo que cada pessoa organize os estudos de acordo com a própria disponibilidade.<\u002Fp>\n      <\u002Fdiv><\u002Farticle>\n      <article class=\"card\"><div class=\"card-body\">\n        <div class=\"icon-box\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 12.500l4.500 4.500L19 7\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>Principais objetivos<\u002Fh3>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:flex;gap:12px\"><span class=\"num\">1<\u002Fspan><p>Reunir cursos, videoaulas, livros e tutoriais em uma só plataforma.<\u002Fp><\u002Fdiv>\n          <div style=\"display:flex;gap:12px\"><span class=\"num\">2<\u002Fspan><p>Tornar a busca por conteúdo gratuito mais simples e segura.<\u002Fp><\u002Fdiv>\n          <div style=\"display:flex;gap:12px\"><span class=\"num\">3<\u002Fspan><p>Permitir estudo em blocos curtos, com progresso visível.<\u002Fp><\u002Fdiv>\n          <div style=\"display:flex;gap:12px\"><span class=\"num\">4<\u002Fspan><p>Valorizar fontes legais e transparentes sobre certificação.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv><\u002Farticle>\n    <\u002Fdiv>\n\n    <div class=\"card\" style=\"margin-top:28px\"><div class=\"card-body\" style=\"padding:28px\">\n      <p class=\"kicker\">Impacto esperado<\u002Fp>\n      <h3 style=\"font-size:26px\">O que esperamos que mude<\u002Fh3>\n      <p style=\"font-size:17px\">Esperamos que mais pessoas se sintam capazes de retomar os estudos sem culpa e sem pressa; que tenham mais autonomia para escolher o que aprender; e que o acesso a materiais educativos gratuitos deixe de depender de saber onde procurar. Em termos sociais, o horizonte é ampliar as oportunidades de formação, de trabalho e de participação na vida da comunidade.<\u002Fp>\n      <p class=\"small\">Este é um protótipo escolar: os impactos descritos são objetivos do projeto, não resultados já medidos.<\u002Fp>\n    <\u002Fdiv><\u002Fdiv>\n\n    <div style=\"padding:64px 0 24px\">\n      <p class=\"quote\">A educação deve acompanhar a realidade das pessoas.<\u002Fp>\n      <div style=\"display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:28px\">\n        <button class=\"btn btn-primary btn-lg\" sc-camel-on-click=\"{{goCourses}}\">Começar a aprender<\u002Fbutton>\n        <button class=\"btn btn-ghost btn-lg\" sc-camel-on-click=\"{{goTutorials}}\">Como encontrar cursos<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ COMO ENCONTRAR CURSOS ============ -->\n<sc-if value=\"{{isTutorials}}\" hint-placeholder-val=\"{{ false }}\">\n  <section class=\"phead\">\n    <div class=\"wrap\">\n      <p class=\"kicker\">Tutoriais<\u002Fp>\n      <h1>Como encontrar cursos gratuitos<\u002Fh1>\n      <p class=\"lead\">Escolha uma plataforma e siga o passo a passo: onde procurar, como saber se é gratuito, como se inscrever e como emitir o certificado, quando existir.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <div class=\"page\"><div class=\"wrap\">\n    <div class=\"notice\">\n      <svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2zM12 10v5M12 18h.01\"><\u002Fpath><\u002Fsvg>\n      <p>As plataformas mudam telas, regras e preços com frequência. Os passos abaixo são um guia geral: sempre confira as informações no site da instituição antes de se inscrever. Os botões “Acessar plataforma” abrem outro site em uma nova aba.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"tut-grid\">\n      <nav class=\"tut-list\" aria-label=\"Plataformas\">\n        <sc-for list=\"{{tutList}}\" as=\"p\" hint-placeholder-count=\"6\">\n          <button class=\"{{p.cls}}\" sc-camel-on-click=\"{{p.pick}}\" aria-pressed=\"{{p.active}}\">{{p.name}}<small>{{p.sub}}<\u002Fsmall><\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fnav>\n      <article class=\"card\" style=\"box-shadow:5px 5px 0 #D6C7A6\">\n        <div class=\"card-body\" style=\"padding:26px\">\n          <h2 style=\"font-size:clamp(24px,3vw,32px)\">{{tut.title}}<\u002Fh2>\n          <p style=\"font-size:17px\">{{tut.about}}<\u002Fp>\n          <div class=\"meta\">\n            <span class=\"pill pill-ok\">{{tut.free}}<\u002Fspan><span class=\"pill\">{{tut.cert}}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0 8px\">\n            <a class=\"btn btn-primary\" href=\"{{tut.url}}\" target=\"_blank\" rel=\"noopener noreferrer\" sc-camel-on-click=\"{{tut.track}}\">Acessar plataforma\n              <svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M7 17L17 7M8 7h9v9\"><\u002Fpath><\u002Fsvg><\u002Fa>\n            <span class=\"small\">Você será direcionado para {{tut.host}}, um site externo.<\u002Fspan>\n          <\u002Fdiv>\n          <ol style=\"list-style:none;margin:0;padding:0\">\n            <sc-for list=\"{{tut.steps}}\" as=\"st\" hint-placeholder-count=\"8\">\n              <li class=\"step\">\n                <span class=\"num\">{{st.n}}<\u002Fspan>\n                <div><h4>{{st.t}}<\u002Fh4><p>{{st.d}}<\u002Fp><\u002Fdiv>\n                <div class=\"shot\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M3 5h18v14H3zM3 15l5-5 5 5 3-3 5 5\"><\u002Fpath><\u002Fsvg>Espaço para captura de tela · passo {{st.n}}<\u002Fdiv>\n              <\u002Fli>\n            <\u002Fsc-for>\n          <\u002Fol>\n          <p class=\"small\">{{tut.note}}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ VIDEOAULAS ============ -->\n<sc-if value=\"{{isVideos}}\" hint-placeholder-val=\"{{ false }}\">\n  <section class=\"phead\">\n    <div class=\"wrap\">\n      <p class=\"kicker\">Videoaulas<\u002Fp>\n      <h1>Aulas completas por matéria e assunto<\u002Fh1>\n      <p class=\"lead\">Aulas gratuitas organizadas por disciplina. Cada botão abre o vídeo ou a playlist indicada, direto no canal original.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <div class=\"page\"><div class=\"wrap\">\n    <div class=\"notice notice-blue\">\n      <svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18zM12 11v5M12 8h.01\"><\u002Fpath><\u002Fsvg>\n      <p><strong>Como funciona:<\u002Fstrong> este protótipo não carrega o player do YouTube dentro da página. Cada botão abre, em uma nova aba, o vídeo (ou a playlist) indicado, no canal original. Título e canal vieram da própria página de cada vídeo. As miniaturas são ilustrativas. Se algum vídeo sair do ar, ele deixará de abrir.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"panel\">\n      <div>\n        <label for=\"vq\" style=\"font-weight:700;display:block;margin-bottom:6px\">Buscar videoaula<\u002Flabel>\n        <div class=\"field\">\n          <svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M11 4a7 7 0 1 0 0 14a7 7 0 0 0 0-14zM21 21l-5-5\"><\u002Fpath><\u002Fsvg>\n          <input id=\"vq\" type=\"search\" placeholder=\"Ex.: equações, fotossíntese, HTML…\" value=\"{{vq}}\" sc-camel-on-change=\"{{onVq}}\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"frow\"><span class=\"flabel\">Matéria<\u002Fspan>\n        <sc-for list=\"{{chipsVcat}}\" as=\"ch\" hint-placeholder-count=\"5\"><button class=\"{{ch.cls}}\" sc-camel-on-click=\"{{ch.pick}}\" aria-pressed=\"{{ch.active}}\">{{ch.label}}<\u002Fbutton><\u002Fsc-for>\n      <\u002Fdiv>\n      <div class=\"frow\"><span class=\"flabel\">Nível<\u002Fspan>\n        <sc-for list=\"{{chipsVlvl}}\" as=\"ch\" hint-placeholder-count=\"3\"><button class=\"{{ch.cls}}\" sc-camel-on-click=\"{{ch.pick}}\" aria-pressed=\"{{ch.active}}\">{{ch.label}}<\u002Fbutton><\u002Fsc-for>\n      <\u002Fdiv>\n      <div class=\"frow\" style=\"justify-content:space-between\">\n        <p class=\"small\" role=\"status\" aria-live=\"polite\"><strong>{{videoCountText}}<\u002Fstrong><\u002Fp>\n        <button class=\"btn-link\" sc-camel-on-click=\"{{clearVideoFilters}}\">Limpar busca e filtros<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{noVideos}}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"empty\"><h3>Nenhuma videoaula encontrada<\u002Fh3><p>Tente outra palavra ou escolha “Todas” em matéria e nível.<\u002Fp>\n        <button class=\"btn btn-blue\" sc-camel-on-click=\"{{clearVideoFilters}}\">Mostrar todas<\u002Fbutton><\u002Fdiv>\n    <\u002Fsc-if>\n    <div class=\"grid-3\">\n      <sc-for list=\"{{videoList}}\" as=\"v\" hint-placeholder-count=\"6\">\n        <article class=\"card\">\n          <div class=\"thumb\" style=\"background-color:{{v.color}}\">\n            <span class=\"badge cover-tag\">{{v.cat}}<\u002Fspan>\n            <span class=\"play\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M7 4.500v15l13-7.500z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <span class=\"topic\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"{{v.icon}}\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"card-body\">\n            <h3>{{v.t}}<\u002Fh3>\n            <p>{{v.d}}<\u002Fp>\n            <div class=\"meta\"><span class=\"pill\">{{v.lvl}}<\u002Fspan><span class=\"pill\">{{v.dur}}<\u002Fspan><\u002Fdiv>\n            <p class=\"small\">Canal: <strong>{{v.ch}}<\u002Fstrong><\u002Fp>\n            <div class=\"actions\">\n              <a class=\"btn btn-blue btn-sm\" href=\"{{v.url}}\" target=\"_blank\" rel=\"noopener noreferrer\" sc-camel-on-click=\"{{v.watch}}\">Assistir no YouTube\n                <svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M7 17L17 7M8 7h9v9\"><\u002Fpath><\u002Fsvg><\u002Fa>\n              <button class=\"heart\" sc-camel-on-click=\"{{v.fav}}\" aria-pressed=\"{{v.isFav}}\" aria-label=\"{{v.favLabel}}\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"fill:{{v.heartFill}}\"><path d=\"M12 20s-7-4.500-7-10a4 4 0 0 1 7-2.500A4 4 0 0 1 19 10c0 5.500-7 10-7 10z\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ LIVROS ============ -->\n<sc-if value=\"{{isBooks}}\" hint-placeholder-val=\"{{ false }}\">\n  <section class=\"phead\">\n    <div class=\"wrap\">\n      <p class=\"kicker\">Biblioteca digital<\u002Fp>\n      <h1>Livros e materiais de leitura<\u002Fh1>\n      <p class=\"lead\">Materiais de estudo e livros para ampliar o conhecimento, com acesso legal: obras de domínio público e conteúdos disponibilizados gratuitamente por órgãos oficiais.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <div class=\"page\"><div class=\"wrap\">\n    <div class=\"notice\">\n      <svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2zM12 10v5M12 18h.01\"><\u002Fpath><\u002Fsvg>\n      <p><strong>Só conteúdo legal.<\u002Fstrong> O Livro Aberto não hospeda cópias de livros. Os botões levam a portais oficiais ou a buscas em acervos de domínio público. Em obras traduzidas, só traduções que estejam em domínio público ou autorizadas podem ser distribuídas: confira a edição antes de baixar. As capas são ilustrativas.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"panel\">\n      <div>\n        <label for=\"bq\" style=\"font-weight:700;display:block;margin-bottom:6px\">Buscar título ou autor<\u002Flabel>\n        <div class=\"field\">\n          <svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M11 4a7 7 0 1 0 0 14a7 7 0 0 0 0-14zM21 21l-5-5\"><\u002Fpath><\u002Fsvg>\n          <input id=\"bq\" type=\"search\" placeholder=\"Ex.: Machado de Assis, Enem, finanças…\" value=\"{{bq}}\" sc-camel-on-change=\"{{onBq}}\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"frow\"><span class=\"flabel\">Biblioteca<\u002Fspan>\n        <sc-for list=\"{{chipsBgrp}}\" as=\"ch\" hint-placeholder-count=\"3\"><button class=\"{{ch.cls}}\" sc-camel-on-click=\"{{ch.pick}}\" aria-pressed=\"{{ch.active}}\">{{ch.label}}<\u002Fbutton><\u002Fsc-for>\n      <\u002Fdiv>\n      <div class=\"frow\"><span class=\"flabel\">Assunto<\u002Fspan>\n        <sc-for list=\"{{chipsBcat}}\" as=\"ch\" hint-placeholder-count=\"6\"><button class=\"{{ch.cls}}\" sc-camel-on-click=\"{{ch.pick}}\" aria-pressed=\"{{ch.active}}\">{{ch.label}}<\u002Fbutton><\u002Fsc-for>\n      <\u002Fdiv>\n      <div class=\"frow\"><span class=\"flabel\">Tipo<\u002Fspan>\n        <sc-for list=\"{{chipsBtype}}\" as=\"ch\" hint-placeholder-count=\"4\"><button class=\"{{ch.cls}}\" sc-camel-on-click=\"{{ch.pick}}\" aria-pressed=\"{{ch.active}}\">{{ch.label}}<\u002Fbutton><\u002Fsc-for>\n      <\u002Fdiv>\n      <div class=\"frow\" style=\"justify-content:space-between\">\n        <p class=\"small\" role=\"status\" aria-live=\"polite\"><strong>{{bookCountText}}<\u002Fstrong><\u002Fp>\n        <button class=\"btn-link\" sc-camel-on-click=\"{{clearBookFilters}}\">Limpar busca e filtros<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{noBooks}}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"empty\"><h3>Nenhum material encontrado<\u002Fh3><p>Tente outro termo ou limpe os filtros.<\u002Fp>\n        <button class=\"btn btn-blue\" sc-camel-on-click=\"{{clearBookFilters}}\">Mostrar todos<\u002Fbutton><\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{hasBooksA}}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"group-title\"><h2>Livros didáticos e materiais de estudo<\u002Fh2><span><\u002Fspan><\u002Fdiv>\n      <div class=\"bk-grid\">\n        <sc-for list=\"{{booksA}}\" as=\"b\" hint-placeholder-count=\"2\">\n          <article class=\"card bk\">\n            <div class=\"bk-cover\" style=\"background-color:{{b.color}}\"><b>{{b.t}}<\u002Fb><span>{{b.au}}<\u002Fspan><\u002Fdiv>\n            <div class=\"bk-info\">\n              <h3>{{b.t}}<\u002Fh3>\n              <p class=\"small\">{{b.au}}<\u002Fp>\n              <div class=\"meta\"><span class=\"pill\">{{b.cat}}<\u002Fspan><span class=\"pill\">{{b.type}}<\u002Fspan><\u002Fdiv>\n              <p>{{b.d}}<\u002Fp>\n              <p class=\"small\"><strong>Disponibilidade:<\u002Fstrong> {{b.avail}}<\u002Fp>\n              <div class=\"bk-links\">\n                <sc-for list=\"{{b.links}}\" as=\"lk\" hint-placeholder-count=\"2\">\n                  <a class=\"btn btn-blue btn-sm\" href=\"{{lk.url}}\" target=\"_blank\" rel=\"noopener noreferrer\" sc-camel-on-click=\"{{lk.track}}\">{{lk.label}}\n                    <svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M7 17L17 7M8 7h9v9\"><\u002Fpath><\u002Fsvg><\u002Fa>\n                <\u002Fsc-for>\n                <button class=\"heart\" sc-camel-on-click=\"{{b.fav}}\" aria-pressed=\"{{b.isFav}}\" aria-label=\"{{b.favLabel}}\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"fill:{{b.heartFill}}\"><path d=\"M12 20s-7-4.500-7-10a4 4 0 0 1 7-2.500A4 4 0 0 1 19 10c0 5.500-7 10-7 10z\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{hasBooksB}}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"group-title\"><h2>Livros para ampliar conhecimentos<\u002Fh2><span><\u002Fspan><\u002Fdiv>\n      <div class=\"bk-grid\">\n        <sc-for list=\"{{booksB}}\" as=\"b\" hint-placeholder-count=\"4\">\n          <article class=\"card bk\">\n            <div class=\"bk-cover\" style=\"background-color:{{b.color}}\"><b>{{b.t}}<\u002Fb><span>{{b.au}}<\u002Fspan><\u002Fdiv>\n            <div class=\"bk-info\">\n              <h3>{{b.t}}<\u002Fh3>\n              <p class=\"small\">{{b.au}}<\u002Fp>\n              <div class=\"meta\"><span class=\"pill\">{{b.cat}}<\u002Fspan><span class=\"pill\">{{b.type}}<\u002Fspan><\u002Fdiv>\n              <p>{{b.d}}<\u002Fp>\n              <p class=\"small\"><strong>Disponibilidade:<\u002Fstrong> {{b.avail}}<\u002Fp>\n              <div class=\"bk-links\">\n                <sc-for list=\"{{b.links}}\" as=\"lk\" hint-placeholder-count=\"2\">\n                  <a class=\"btn btn-blue btn-sm\" href=\"{{lk.url}}\" target=\"_blank\" rel=\"noopener noreferrer\" sc-camel-on-click=\"{{lk.track}}\">{{lk.label}}\n                    <svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M7 17L17 7M8 7h9v9\"><\u002Fpath><\u002Fsvg><\u002Fa>\n                <\u002Fsc-for>\n                <button class=\"heart\" sc-camel-on-click=\"{{b.fav}}\" aria-pressed=\"{{b.isFav}}\" aria-label=\"{{b.favLabel}}\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"fill:{{b.heartFill}}\"><path d=\"M12 20s-7-4.500-7-10a4 4 0 0 1 7-2.500A4 4 0 0 1 19 10c0 5.500-7 10-7 10z\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Farticle>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv><\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ APRENDA EM MINUTOS ============ -->\n<sc-if value=\"{{isShorts}}\" hint-placeholder-val=\"{{ false }}\">\n  <section class=\"phead\">\n    <div class=\"wrap\">\n      <p class=\"kicker\">Vídeos curtos<\u002Fp>\n      <h1>Aprenda em minutos<\u002Fh1>\n      <p class=\"lead\">Vídeos explicativos para o intervalo do trabalho: curiosidades, conceitos escolares, dicas profissionais, idiomas e tecnologia. Sem reprodução automática e sem som surpresa.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <div class=\"page\"><div class=\"wrap\">\n    <div class=\"notice notice-blue\">\n      <svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18zM12 11v5M12 8h.01\"><\u002Fpath><\u002Fsvg>\n      <p>Cada cartão leva a um vídeo explicativo no YouTube, em uma nova aba. Nada toca sozinho. A duração de cada vídeo pode variar, então confira antes de assistir.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"frow\" style=\"margin-bottom:20px\"><span class=\"flabel\">Tema<\u002Fspan>\n      <sc-for list=\"{{chipsScat}}\" as=\"ch\" hint-placeholder-count=\"6\"><button class=\"{{ch.cls}}\" sc-camel-on-click=\"{{ch.pick}}\" aria-pressed=\"{{ch.active}}\">{{ch.label}}<\u002Fbutton><\u002Fsc-for>\n    <\u002Fdiv>\n    <p class=\"small\" role=\"status\" aria-live=\"polite\" style=\"margin-bottom:10px\"><strong>{{shortCountText}}<\u002Fstrong><\u002Fp>\n    <div class=\"feed\" tabindex=\"0\" aria-label=\"Lista de temas, role para o lado\">\n      <sc-for list=\"{{shortList}}\" as=\"s\" hint-placeholder-count=\"5\">\n        <article class=\"card short\">\n          <div class=\"vert\" style=\"background-color:{{s.color}}\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center\"><span class=\"cover-tag\">{{s.cat}}<\u002Fspan><span class=\"dur\">{{s.dur}}<\u002Fspan><\u002Fdiv>\n            <h3>{{s.t}}<\u002Fh3>\n            <span class=\"play\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M7 4.500v15l13-7.500z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"card-body\">\n            <p class=\"small\">{{s.d}}<\u002Fp>\n            <p class=\"small\">Canal: <strong>{{s.ch}}<\u002Fstrong><\u002Fp>\n            <div class=\"actions\">\n              <a class=\"btn btn-primary btn-sm\" href=\"{{s.url}}\" target=\"_blank\" rel=\"noopener noreferrer\" sc-camel-on-click=\"{{s.watch}}\">Assistir<\u002Fa>\n              <button class=\"heart\" sc-camel-on-click=\"{{s.fav}}\" aria-pressed=\"{{s.isFav}}\" aria-label=\"{{s.favLabel}}\"><svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\" style=\"fill:{{s.heartFill}}\"><path d=\"M12 20s-7-4.500-7-10a4 4 0 0 1 7-2.500A4 4 0 0 1 19 10c0 5.500-7 10-7 10z\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <sc-if value=\"{{noShorts}}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"empty\"><h3>Nenhum tema nesta categoria<\u002Fh3><p>Escolha outro tema ou veja todos.<\u002Fp>\n        <button class=\"btn btn-blue\" sc-camel-on-click=\"{{clearShortFilter}}\">Ver todos os temas<\u002Fbutton><\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{hasRelated}}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"group-title\"><h2>Relacionados a “{{lastShortTitle}}”<\u002Fh2><span><\u002Fspan><\u002Fdiv>\n      <div class=\"grid\">\n        <sc-for list=\"{{relatedShorts}}\" as=\"s\" hint-placeholder-count=\"3\">\n          <article class=\"card\"><div class=\"card-body\">\n            <span class=\"pill\">{{s.cat}}<\u002Fspan>\n            <h3>{{s.t}}<\u002Fh3>\n            <p>{{s.d}}<\u002Fp>\n            <p class=\"small\">Canal: <strong>{{s.ch}}<\u002Fstrong><\u002Fp>\n            <div class=\"actions\"><a class=\"btn btn-blue btn-sm\" href=\"{{s.url}}\" target=\"_blank\" rel=\"noopener noreferrer\" sc-camel-on-click=\"{{s.watch}}\">Assistir<\u002Fa><\u002Fdiv>\n          <\u002Fdiv><\u002Farticle>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{noRelated}}\" hint-placeholder-val=\"{{ true }}\">\n      <p class=\"small\" style=\"margin-top:20px\">Assista a um tema para ver sugestões relacionadas aqui.<\u002Fp>\n    <\u002Fsc-if>\n  <\u002Fdiv><\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ ÁREA DO ESTUDANTE ============ -->\n<sc-if value=\"{{isStudent}}\" hint-placeholder-val=\"{{ false }}\">\n  <section class=\"phead\">\n    <div class=\"wrap\" style=\"display:flex;gap:20px;align-items:center;flex-wrap:wrap\">\n      <div class=\"avatar\" aria-hidden=\"true\">{{initial}}<\u002Fdiv>\n      <div style=\"flex:1;min-width:240px\">\n        <p class=\"kicker\">Área do estudante<\u002Fp>\n        <h1 style=\"font-size:clamp(28px,4vw,44px)\">{{greeting}}<\u002Fh1>\n        <p class=\"lead\" style=\"margin-top:6px;font-size:17px\">{{accountLine}}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <div class=\"page\"><div class=\"wrap\">\n    <div class=\"notice\">\n      <svg class=\"ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2zM12 10v5M12 18h.01\"><\u002Fpath><\u002Fsvg>\n      <p><strong>Protótipo demonstrativo.<\u002Fstrong> Não há servidor nem banco de dados: o cadastro, o progresso, os favoritos e o histórico ficam apenas neste navegador e podem ser apagados a qualquer momento. Nada é enviado pela internet. Os certificados gerados aqui são demonstrativos e não têm validade.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"stats\">\n      <div class=\"stat\"><b>{{stats.started}}<\u002Fb><span>cursos em andamento<\u002Fspan><\u002Fdiv>\n      <div class=\"stat\"><b>{{stats.finished}}<\u002Fb><span>cursos concluídos<\u002Fspan><\u002Fdiv>\n      <div class=\"stat\"><b>{{stats.lessons}}<\u002Fb><span>aulas marcadas como concluídas<\u002Fspan><\u002Fdiv>\n      <div class=\"stat\"><b>{{stats.favs}}<\u002Fb><span>itens favoritos<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"st-grid\">\n      <div style=\"display:flex;flex-direction:column;gap:24px\">\n        <section class=\"side-card\">\n          <h2 style=\"font-size:24px\">Cursos iniciados<\u002Fh2>\n          <sc-if value=\"{{noStarted}}\" hint-placeholder-val=\"{{ false }}\">\n            <div class=\"empty\" style=\"padding:28px 16px\"><h3 style=\"font-size:20px\">Você ainda não iniciou nenhum curso<\u002Fh3><p>Escolha um curso no catálogo e marque a primeira aula.<\u002Fp><button class=\"btn btn-blue\" sc-camel-on-click=\"{{goCourses}}\">Ver cursos<\u002Fbutton><\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-for list=\"{{startedList}}\" as=\"c\" hint-placeholder-count=\"2\">\n            <div class=\"row\">\n              <div class=\"grow\"><b>{{c.t}}<\u002Fb><progress class=\"prog\" value=\"{{c.pct}}\" max=\"100\" aria-label=\"Progresso em {{c.t}}\" style=\"margin-top:8px\">{{c.pct}}%<\u002Fprogress><span class=\"small\">{{c.doneText}}<\u002Fspan><\u002Fdiv>\n              <button class=\"btn btn-blue btn-sm\" sc-camel-on-click=\"{{c.open}}\">Continuar<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsection>\n\n        <section class=\"side-card\">\n          <h2 style=\"font-size:24px\">Cursos concluídos e certificados<\u002Fh2>\n          <sc-if value=\"{{noFinished}}\" hint-placeholder-val=\"{{ true }}\">\n            <p class=\"small\">Quando você marcar todas as aulas de um curso, ele aparece aqui com um certificado demonstrativo. Para certificados reais, veja as condições da plataforma responsável pelo curso externo.<\u002Fp>\n          <\u002Fsc-if>\n          <sc-for list=\"{{finishedList}}\" as=\"c\" hint-placeholder-count=\"1\">\n            <div class=\"row\">\n              <div class=\"grow\"><b>{{c.t}}<\u002Fb><span class=\"small\">100% das aulas concluídas<\u002Fspan><\u002Fdiv>\n              <button class=\"btn btn-ghost btn-sm\" sc-camel-on-click=\"{{c.showCert}}\">Certificado demonstrativo<\u002Fbutton>\n              <sc-if value=\"{{c.hasExt}}\" hint-placeholder-val=\"{{ false }}\">\n                <a class=\"btn-link\" href=\"{{c.extUrl}}\" target=\"_blank\" rel=\"noopener noreferrer\">Certificado real: ver no site do provedor<\u002Fa>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsection>\n\n        <section class=\"side-card\">\n          <h2 style=\"font-size:24px\">Materiais favoritos<\u002Fh2>\n          <sc-if value=\"{{noFavs}}\" hint-placeholder-val=\"{{ false }}\">\n            <p class=\"small\">Toque no coração de um curso, videoaula, livro ou tema para guardá-lo aqui.<\u002Fp>\n          <\u002Fsc-if>\n          <sc-for list=\"{{favList}}\" as=\"f\" hint-placeholder-count=\"2\">\n            <div class=\"row\">\n              <div class=\"grow\"><b>{{f.t}}<\u002Fb><span class=\"small\">{{f.kind}}<\u002Fspan><\u002Fdiv>\n              <sc-if value=\"{{f.isInternal}}\" hint-placeholder-val=\"{{ false }}\">\n                <button class=\"btn btn-blue btn-sm\" sc-camel-on-click=\"{{f.open}}\">Abrir<\u002Fbutton>\n              <\u002Fsc-if>\n              <sc-if value=\"{{f.isExternal}}\" hint-placeholder-val=\"{{ false }}\">\n                <a class=\"btn btn-blue btn-sm\" href=\"{{f.url}}\" target=\"_blank\" rel=\"noopener noreferrer\" sc-camel-on-click=\"{{f.track}}\">Abrir (site externo)<\u002Fa>\n              <\u002Fsc-if>\n              <button class=\"btn btn-ghost btn-sm\" sc-camel-on-click=\"{{f.remove}}\" aria-label=\"{{f.removeLabel}}\">Remover<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsection>\n      <\u002Fdiv>\n\n      <aside style=\"display:flex;flex-direction:column;gap:24px\">\n        <section class=\"side-card\">\n          <sc-if value=\"{{loggedIn}}\" hint-placeholder-val=\"{{ false }}\">\n            <h3>Sua conta demonstrativa<\u002Fh3>\n            <p class=\"small\">Conectado como <strong>{{userEmail}}<\u002Fstrong>.<\u002Fp>\n            <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{logout}}\">Sair da conta<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{loggedOut}}\" hint-placeholder-val=\"{{ true }}\">\n            <h3>Entrar ou criar conta<\u002Fh3>\n            <p class=\"small\">Opcional. A conta demonstrativa só personaliza esta tela e fica neste navegador. Não use uma senha que você utiliza em outros lugares.<\u002Fp>\n            <div class=\"tabs\">\n              <button class=\"{{tabLoginCls}}\" sc-camel-on-click=\"{{tabLogin}}\" aria-pressed=\"{{tabIsLogin}}\">Entrar<\u002Fbutton>\n              <button class=\"{{tabSignupCls}}\" sc-camel-on-click=\"{{tabSignup}}\" aria-pressed=\"{{tabIsSignup}}\">Criar conta<\u002Fbutton>\n            <\u002Fdiv>\n            <form class=\"form\" sc-camel-on-submit=\"{{submitAuth}}\" novalidate=\"\">\n              <sc-if value=\"{{authErrBox}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"errbox\" role=\"alert\">{{authErrBox}}<\u002Fp><\u002Fsc-if>\n              <sc-if value=\"{{tabIsSignup}}\" hint-placeholder-val=\"{{ false }}\">\n                <div><label for=\"f-name\">Nome<\u002Flabel><input id=\"f-name\" type=\"text\" autocomplete=\"name\" value=\"{{f.name}}\" sc-camel-on-change=\"{{onName}}\">\n                  <sc-if value=\"{{err.name}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"err\">{{err.name}}<\u002Fp><\u002Fsc-if><\u002Fdiv>\n              <\u002Fsc-if>\n              <div><label for=\"f-email\">E-mail<\u002Flabel><input id=\"f-email\" type=\"email\" autocomplete=\"email\" value=\"{{f.email}}\" sc-camel-on-change=\"{{onEmail}}\">\n                <sc-if value=\"{{err.email}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"err\">{{err.email}}<\u002Fp><\u002Fsc-if><\u002Fdiv>\n              <div><label for=\"f-pass\">Senha (mínimo 6 caracteres)<\u002Flabel><input id=\"f-pass\" type=\"password\" autocomplete=\"current-password\" value=\"{{f.pass}}\" sc-camel-on-change=\"{{onPass}}\">\n                <sc-if value=\"{{err.pass}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"err\">{{err.pass}}<\u002Fp><\u002Fsc-if><\u002Fdiv>\n              <button type=\"submit\" class=\"btn btn-primary\">{{authBtn}}<\u002Fbutton>\n            <\u002Fform>\n          <\u002Fsc-if>\n        <\u002Fsection>\n\n        <section class=\"side-card\">\n          <h3>Histórico de conteúdos<\u002Fh3>\n          <sc-if value=\"{{noHist}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"small\">Os conteúdos que você abrir aparecem aqui.<\u002Fp><\u002Fsc-if>\n          <sc-for list=\"{{histList}}\" as=\"h\" hint-placeholder-count=\"3\">\n            <div class=\"row\" style=\"padding:8px 0\"><div class=\"grow\"><b style=\"font-size:15px\">{{h.t}}<\u002Fb><span class=\"small\">{{h.kind}} · {{h.when}}<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{hasHist}}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btn-link\" sc-camel-on-click=\"{{clearHist}}\">Limpar histórico<\u002Fbutton><\u002Fsc-if>\n        <\u002Fsection>\n\n        <section class=\"side-card\">\n          <h3>Dados deste navegador<\u002Fh3>\n          <p class=\"small\">Apague progresso, favoritos, histórico e conta demonstrativa guardados aqui.<\u002Fp>\n          <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{resetAll}}\">Apagar todos os dados<\u002Fbutton>\n        <\u002Fsection>\n      <\u002Faside>\n    <\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ============ PÁGINA NÃO ENCONTRADA ============ -->\n<sc-if value=\"{{isNotFound}}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"page\"><div class=\"wrap err404\">\n    <p class=\"big\">404<\u002Fp>\n    <h1 style=\"font-size:clamp(28px,4vw,40px);margin:8px 0 14px\">Esta página não está disponível<\u002Fh1>\n    <p class=\"lead\" style=\"margin:0 auto 24px\">O endereço pode ter mudado ou o conteúdo não existe mais. Sem problema: volte ao início ou procure um curso.<\u002Fp>\n    <div style=\"display:flex;gap:12px;justify-content:center;flex-wrap:wrap\">\n      <button class=\"btn btn-primary btn-lg\" sc-camel-on-click=\"{{goHome}}\">Voltar ao início<\u002Fbutton>\n      <button class=\"btn btn-ghost btn-lg\" sc-camel-on-click=\"{{goCourses}}\">Ver cursos<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fmain>\n\n<!-- ============ RODAPÉ ============ -->\n<footer class=\"foot\">\n  <div class=\"wrap\">\n    <div class=\"foot-grid\">\n      <div class=\"brand-f\">\n        <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:12px\">\n          <svg class=\"brand-mark\" sc-camel-view-box=\"0 0 42 42\" aria-hidden=\"true\">\n            <rect x=\"1.500\" y=\"1.500\" width=\"39\" height=\"39\" rx=\"6\" fill=\"#F7F0E1\" stroke=\"#E2A53B\" stroke-width=\"2\"><\u002Frect>\n            <path d=\"M8 29V13c4-1.500 8-1 13 2 5-3 9-3.500 13-2v16c-4-1.500-8-1-13 2-5-3-9-3.500-13-2z\" fill=\"#12495C\"><\u002Fpath>\n            <path d=\"M21 15v16\" stroke=\"#F7F0E1\" stroke-width=\"2\"><\u002Fpath>\n          <\u002Fsvg>\n          <span class=\"brand-name\">Livro Aberto<\u002Fspan>\n        <\u002Fdiv>\n        <p>Plataforma educacional para quem quer continuar aprendendo, mesmo com a rotina corrida.<\u002Fp>\n        <p class=\"small\" style=\"margin-top:12px\">Protótipo de projeto escolar · [NOME DA EQUIPE / ESCOLA]<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h4>Explorar<\u002Fh4>\n        <sc-for list=\"{{footA}}\" as=\"n\" hint-placeholder-count=\"4\"><button class=\"fl\" sc-camel-on-click=\"{{n.go}}\">{{n.label}}<\u002Fbutton><\u002Fsc-for>\n      <\u002Fdiv>\n      <div>\n        <h4>Aprender<\u002Fh4>\n        <sc-for list=\"{{footB}}\" as=\"n\" hint-placeholder-count=\"4\"><button class=\"fl\" sc-camel-on-click=\"{{n.go}}\">{{n.label}}<\u002Fbutton><\u002Fsc-for>\n      <\u002Fdiv>\n      <div>\n        <h4>Transparência<\u002Fh4>\n        <p class=\"small\">Links externos abrem em outra aba e levam a sites que não pertencem ao Livro Aberto. O Livro Aberto não tem parcerias com as instituições citadas nem emite certificados oficiais. Dados de progresso ficam só neste navegador.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<!-- ============ CERTIFICADO DEMONSTRATIVO ============ -->\n<sc-if value=\"{{showCertDlg}}\" hint-placeholder-val=\"{{ false }}\">\n  <dialog open=\"\" class=\"cert-d\" aria-label=\"Certificado demonstrativo\">\n    <div class=\"cert\">\n      <p class=\"kicker\">Livro Aberto · certificado demonstrativo<\u002Fp>\n      <h2>Certificado de participação<\u002Fh2>\n      <p style=\"margin-top:14px\">Este documento demonstra que<\u002Fp>\n      <p style=\"font-family:'Fraunces',Georgia,'Times New Roman',serif;font-size:30px;color:#0C3443;margin:6px 0\">
